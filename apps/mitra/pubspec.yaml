name: kunbar_mitra
description: KUNBAR Mitra - aplikasi driver/kurir jastip & ojek
publish_to: none
version: 1.11.2+15

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.2.0
  geolocator: ^12.0.0
  url_launcher: ^6.3.0
  # 2.3.x: API async (`SharedPreferencesAsync`) baru ada di Android impl 2.3+.
  # Versi lama + AAR baru = getAll(...) hilang di release (NoSuchMethodError).
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  # 13.x menarik permission_handler_android 14.x yang WAJIB compileSdk 37 (belum ada di
  # runner GitHub) -> kunci di 12.x (android impl 13.x, compileSdk 35).
  permission_handler: ^12.0.3
  intl: ^0.19.0
  http: ^1.2.2
  # Peta gratis: satu API untuk beberapa backend. any_map_maplibre yang
  # membawa MapLibre-nya (OpenFreeMap = tiles tanpa API key).
  fl_chart: ^1.2.0
  image_picker: ^1.1.2
  any_map: ^1.0.0
  any_map_maplibre: ^1.0.0
  # Suara petunjuk navigasi (TTS) - butuh mesin suara Indonesia di HP.
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
