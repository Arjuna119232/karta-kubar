# Konfigurasi ikon launcher - Android saja.
#
# WAJIB dibungkus key `flutter_launcher_icons:` di level teratas. Source
# flutter_launcher_icons hanya membaca json['flutter_launcher_icons'] dari file
# ini; tanpa wrapper dia mengembalikan null lalu DIJATUHKAN ke pubspec.yaml -
# dan karena itu `ios: false` di sini diam-diam tidak berlaku.
flutter_launcher_icons:
  # `ios: false` juga wajib eksplisit, default Config adalah true.
  ios: false
  android: "launcher_icon"
  image_path: "assets/icon/icon-1024.png"
  min_sdk_android: 21

  # inset 0 disengaja: file ikon sudah punya margin ~26% di semua sisi,
  # sedangkan area aman adaptive Android hanya butuh 19,5%. Inset default 16%
  # hanya akan mengecilkan logo tanpa perlu.
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: "assets/icon/icon-1024.png"
  adaptive_icon_foreground_inset: 0
