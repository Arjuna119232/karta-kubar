# Konfigurasi ikon app - iOS saja.
#
# WAJIB dibungkus key `flutter_launcher_icons:` di level teratas (lihat catatan
# di tool/icons_android.yaml). Selain itu `android: false` supaya paket ini
# tidak menyentuh res/mipmap yang tidak ada di job macOS.
flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/icon/icon-1024.png"
  # Sumber sudah mode RGB tanpa alpha, tapi tetap diaktifkan sebagai
  # pengaman: PNG ber-alpha akan dirender iOS sebagai kotak hitam.
  remove_alpha_ios: true
