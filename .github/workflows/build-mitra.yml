name: Build KUNBAR Mitra APK
on:
  workflow_dispatch:
  push:
    paths: ['apps/mitra/**', '.github/workflows/build-mitra.yml']
    branches: ['**']
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mitra } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: bash tools/setup_android.sh
      - run: flutter pub get
      # Analisa hanya memberi laporan; tidak boleh menggagalkan build.
      - run: flutter analyze --no-fatal-infos
        continue-on-error: true
      - name: Tampilkan paket yang terpasang
        run: flutter pub deps --style=compact | head -40
      - name: Build APK (arm64)
        run: >
          flutter build apk --release --target-platform android-arm64
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=FCM_API_KEY=${{ secrets.FCM_API_KEY }}
          --dart-define=FCM_APP_ID=${{ secrets.FCM_APP_ID }}
          --dart-define=FCM_SENDER_ID=${{ secrets.FCM_SENDER_ID }}
          --dart-define=FCM_PROJECT_ID=${{ secrets.FCM_PROJECT_ID }}
      - run: ls -l build/app/outputs/flutter-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: kunbar-mitra-apk
          path: apps/mitra/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error