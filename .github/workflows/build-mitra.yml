name: Build KUNBAR Mitra APK
# Catatan: `flutter analyze` sekarang memblokir build. Kalau ada warning, build
# berhenti di awal - lebih murah daripada menunggu 5 menit lalu gagal.
on:
  workflow_dispatch:
    inputs:
      analyze-only:
        description: 'Hanya analyze, tanpa build APK'
        type: string
        default: 'no'
  push:
    paths: ['apps/mitra/**', '.github/workflows/build-mitra.yml']
    branches: ['**']
jobs:
  apk:
    # analyze-only: cek analyze + struktur tanpa build APK (dipakai saat masih
    # develops banyak halaman, buildFinal baru setelah semua beres).
    if: github.event.inputs.analyze-only != 'yes'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mitra } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: bash tools/setup_android.sh
      # Tanpa langkah ini APK release tertandatangani debug key yang DI-GENERATE
      # ULANG tiap run -> sertifikatnya berubah terus dan update di atas APK lama
      # selalu gagal ("App not installed"). Keystore disimpan di GitHub Secrets.
      - name: Restore keystore (release signing)
        run: |
          mkdir -p android
          echo "${{ secrets.KUNBAR_MITRA_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.KUNBAR_MITRA_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KUNBAR_MITRA_KEY_ALIAS }}
          keyPassword=${{ secrets.KUNBAR_MITRA_KEY_PASSWORD }}
          EOF
          test -s android/app/upload-keystore.jks || { echo "FAIL: keystore kosong"; exit 1; }
      - name: Pasang signing config release
        run: python3 tool/patch_signing.py
      # R8 (minify) aktif di build release. Tanpa aturan keep, anggota kelas
      # plugin bisa hilang -> NoSuchMethodError hanya di release (debug aman).
      - name: Pasang aturan R8 untuk plugin (proguard)
        run: python3 tool/patch_proguard.py
      # Cache build lama bisa mencampur dua versi AAR plugin yang berbeda ->
      # NoSuchMethodError pada registrar Pigeon. Selalu mulai dari bersih.
      - run: flutter clean
      - run: flutter pub get
      - run: flutter analyze
      - name: Build APK (universal, 1 file)
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=FCM_API_KEY=${{ secrets.FCM_API_KEY }}
          --dart-define=FCM_APP_ID=${{ secrets.FCM_APP_ID }}
          --dart-define=FCM_SENDER_ID=${{ secrets.FCM_SENDER_ID }}
          --dart-define=FCM_PROJECT_ID=${{ secrets.FCM_PROJECT_ID }}
      - run: ls -l build/app/outputs/flutter-apk/
      - name: Verifikasi APK tidak memakai debug key
        run: |
          APKSIGNER="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | tail -1)"
          [ -x "$APKSIGNER" ] || APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)"
          DN="$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -m1 'certificate DN')"
          echo "$DN"
          case "$DN" in *"Android Debug"*) echo "GAGAL: APK masih debug key"; exit 1;; esac
      - uses: actions/upload-artifact@v4
        with:
          name: kunbar-mitra-apk
          path: apps/mitra/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
  analyze:
    if: github.event.inputs.analyze-only == 'yes'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mitra } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter analyze
      - run: python3 ../../tool/check_nonlatin.py
