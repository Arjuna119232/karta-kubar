name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform (android/ folder)
        run: |
          flutter create --org id.kartakubar --project-name app --platforms=android /tmp/scaffold
          cp -r /tmp/scaffold/android .

      - name: Restore upload keystore (release signing)
        run: |
          mkdir -p android
          echo "${{ secrets.KK_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.KK_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KK_KEY_ALIAS }}
          keyPassword=${{ secrets.KK_KEY_PASSWORD }}
          EOF
          test -s android/app/upload-keystore.jks || { echo "FAIL: keystore kosong"; exit 1; }

      - name: Apply Android patches (branding, permissions)
        run: bash tool/patch_android.sh

      - name: Apply release signing
        run: python3 tool/patch_signing.py

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: karta-kubar-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Read version from pubspec.yaml
        id: ver
        run: echo "version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-${{ github.run_number }}
          name: KARTA KUBAR v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          body_path: .github/notes/release.md
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
