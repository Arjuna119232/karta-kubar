name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      demo:
        description: 'Mode demo (OTP 123456 + pengalih role). Matikan setelah backend aktif.'
        type: choice
        options: ['true', 'false']
        default: 'true'
      abi:
        description: 'Arsitektur CPU untuk APK. arm64 saja = APK paling kecil (~18 MB).'
        type: choice
        options: ['arm64', 'universal']
        default: 'arm64'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform (android/ folder)
        run: |
          flutter create --org id.kubarkonek --project-name app --platforms=android /tmp/scaffold
          cp -r /tmp/scaffold/android .

      - name: Restore upload keystore (release signing)
        run: |
          mkdir -p android
          echo "${{ secrets.KK_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.KK_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KK_KEY_ALIAS }}
          keyPassword=${{ secrets.KK_KEY_PASSWORD }}
          EOF
          test -s android/app/upload-keystore.jks || { echo "FAIL: keystore kosong"; exit 1; }

      - name: Apply Android patches (branding, permissions)
        run: bash tool/patch_android.sh

      # WAJIB setelah `flutter create`: android/ baru saja dibuat ulang, jadi
      # theme + ikon splash native Android 12+ harus dipasang ulang di sini.
      # Script ini memblokir build kalau gagal (warna != AppColors.primary,
      # installSplashScreen() salah urutan, ikon tidak muat circle 192dp, dll).
      - name: Apply native splash (Android 12+ Theme.SplashScreen)
        run: python3 tool/patch_splash_android.py

      # Aset splash harus SUDAH ada di repo dan terbukti fitting. Script ini
      # sekaligus memverifikasi ikon benar-benar muat di mask circle 192dp.
      # Pillow tidak ada di runner, jadi dipasang di sini (butuh beberapa detik).
      - name: Verify splash assets fit Android 12 circle mask
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 tool/gen_splash_icons.py

      - name: Apply release signing
        run: python3 tool/patch_signing.py

      # WAJIB setelah `flutter create` + patch. Folder android/ baru saja
      # dibuat ulang, jadi ikon harus digenerate ulang di sini juga.
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons -f tool/icons_android.yaml

      - name: Flutter pub get
        run: flutter pub get

      # WAJIB dan WAJIB memblokir (tanpa `|| true`).
      # Flutter hanya mengompilasi file yang terjangkau dari main.dart, jadi
      # bug di file yang tidak ter-import (mis. `undefined name`) TIDAK akan
      # ketahuan oleh `flutter build`. Script ini yang menangkapnya.
      - name: Dart static check (blocking)
        run: python3 tool/check_dart.py

      # Karakter non-Latin (CJK/Kana/Hangul) pernah nyasar ke komentar dari IME.
      - name: Non-Latin check (blocking)
        run: python3 tool/check_nonlatin.py

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      # APK hanya untuk arm64 (semua HP Android modern). ABI lain (x86_64,
      # armeabi-v7a) menambah ~35 MB tanpa perlu - emulator x86 dan HP
      # sangat lama bisa pakai AAB / build manual dengan --target-platform.
      - name: Build release APK (arm64 only)
        if: github.event.inputs.abi != 'universal'
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --dart-define=KUNBAR_DEMO=${{ github.event.inputs.demo || 'true' }}

      - name: Build release APK (universal)
        if: github.event.inputs.abi == 'universal'
        run: |
          flutter build apk --release \
            --dart-define=KUNBAR_DEMO=${{ github.event.inputs.demo || 'true' }}

      # Play Store mewajibkan AAB (bukan APK) untuk aplikasi baru. AAB selalu
      # dipisah per ABI oleh Play, jadi ukurannya kecil tanpa perlu flag apa pun.
      - name: Build release AAB (Play Store)
        run: flutter build appbundle --release --dart-define=KUNBAR_DEMO=${{ github.event.inputs.demo || 'true' }}

      - name: Report artifact sizes
        run: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: karta-kubar-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: Read version from pubspec.yaml
        id: ver
        run: echo "version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-${{ github.run_number }}
          name: KUNBAR Connect v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          body_path: .github/notes/release.md
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
