name: kubar_connect
description: "KUNBAR Connect — Kuningan Barat Connected Community. Satu Kelurahan, Satu Komunitas, Satu Aplikasi."
publish_to: "none"
version: 0.7.0+13

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/icons/
    - assets/ilustrasi/
    - assets/brand/

# Catatan ikon launcher
# --------------------
# Konfigurasi ikon TIDAK ditulis di blok `flutter_launcher_icons:` pada
# pubspec.yaml. Alasannya: paket itu MEMGABUNG config `-f` dengan config di
# pubspec.yaml, dan nilai `ios: true` di pubspec tetap menang - Akibatnya job
# Android tetap mencoba menulis AppIcon iOS lalu gagal:
#   PathNotFoundException: ios/Runner/Assets.xcassets/AppIcon.appiconset/...
#
# Sumber kebenaran ada di dua file terpisah:
#   tool/icons_android.yaml -> dipakai .github/workflows/build.yml
#   tool/icons_ios.yaml    -> dipakai .github/workflows/build-ios.yml
